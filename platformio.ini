; =============================================
; BidKan IoT — PlatformIO Configuration
; Board: LilyGO T-A7670SA (ESP32 + SIMCOM A7670)
; =============================================

; --- Base config สำหรับทุก environment ---
[env]
platform = espressif32
board = esp-wrover-kit
framework = arduino
monitor_speed = 115200
board_build.partitions = min_spiffs.csv

; =============================================
; Production — ระบบจริงบนรถ
; =============================================
[env:production]
build_src_filter = +<*> -<test_*.cpp>
build_flags = 
	-DBOARD_HAS_PSRAM
	-mfix-esp32-psram-cache-issue
	-DTINY_GSM_MODEM_A7672X
	-DTINY_GSM_RX_BUFFER=1024
lib_deps = 
	vshymanskyy/TinyGSM@^0.12.0
	knolleary/PubSubClient@^2.8
	bblanchon/ArduinoJson@^7
	arduino-libraries/ArduinoHttpClient@^0.6.0
	h2zero/NimBLE-Arduino@^1.4.1

; =============================================
; Hardware Tests — flash ทีละชิ้น
; =============================================

; ทดสอบ Relay (ล็อก/ปลดล็อก)
[env:test_relay]
build_src_filter = -<*> +<../test/test_relay.cpp>

; ทดสอบ GPS ด้วย AT Commands ตรง
[env:test_gps]
build_src_filter = -<*> +<../test/test_gps.cpp>
build_flags = 
	-DTINY_GSM_MODEM_A7672X
	-DTINY_GSM_RX_BUFFER=1024
lib_deps = 
	vshymanskyy/TinyGSM@^0.12.0

; ทดสอบ ADC อ่านค่าแบตเตอรี่
[env:test_adc]
build_src_filter = -<*> +<../test/test_adc.cpp>

; ทดสอบ MQTT ผ่าน WiFi (dev ใน lab)
[env:test_wifi]
build_src_filter = -<*> +<../test/test_wifi.cpp>
lib_deps = 
	knolleary/PubSubClient@^2.8

; ทดสอบ Buzzer / Speaker (ปลดล็อก, ล็อก, Geofence Alert, Siren)
[env:test_buzzer]
build_src_filter = -<*> +<../test/test_buzzer.cpp> +<buzzer/BuzzerManager.cpp>
